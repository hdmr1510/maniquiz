<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifest Quiz Oyunu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #e94560;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #00fff5;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        button.main-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        button.main-btn:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .option-btn.correct {
            background: #2ed573 !important;
            color: white;
        }

        .option-btn.wrong {
            background: #ff4757 !important;
            color: white;
        }

        .feedback-msg {
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .input-group {
            margin: 15px 0;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 1rem;
            text-align: center;
        }

        /* Liderlik Tablosu & Admin Stilleri */
        .leaderboard {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }

        .leaderboard h3 {
            color: #00fff5;
            margin-bottom: 10px;
            text-align: center;
        }

        .leaderboard-list {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .admin-controls {
            display: flex;
            gap: 5px;
        }

        .admin-action-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .admin-action-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .admin-panel-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(233, 69, 96, 0.15);
            border: 1px dashed #e94560;
            border-radius: 10px;
        }

        .admin-panel-box input {
            padding: 6px;
            margin: 4px 0;
            border-radius: 5px;
            border: 1px solid #ff6b81;
            background: rgba(0,0,0,0.4);
            color: white;
            width: 48%;
        }

        .admin-tag {
            background: #e94560;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <!-- Giris Ekrani -->
        <div id="start-screen" class="screen">
            <h1>Manifest Quiz</h1>
            <p style="margin-bottom: 15px;">Ne kadar sıkı bir Manifest dinleyicisisin? Görelim!</p>
            
            <button class="main-btn" onclick="oyunuBaslat()">Oyuna Başla</button>

            <!-- Ortak Canlı Skor Tablosu -->
            <div class="leaderboard">
                <h3>🏆 Canlı Liderlik Tablosu <span id="admin-indicator" class="admin-tag hidden">ADMIN MODU</span></h3>
                
                <ul id="leaderboard-list" class="leaderboard-list">
                    <li style="text-align:center; color:#aaa;">Yükleniyor...</li>
                </ul>

                <!-- Admin Özel Ekli Alanı -->
                <div id="admin-panel" class="admin-panel-box hidden">
                    <h4 style="color:#e94560; margin-bottom:8px;">⚙️ Admin Yönetim Paneli</h4>
                    <div>
                        <input type="text" id="admin-add-name" placeholder="Oyuncu Adı">
                        <input type="number" id="admin-add-score" placeholder="Puan">
                        <button class="main-btn" style="font-size:0.85rem; padding:6px;" onclick="adminOyuncuEkle()">➕ Oyuncu Ekle</button>
                    </div>
                    <button class="main-btn" style="background:#ff4757; font-size:0.8rem; padding:6px; margin-top:8px;" onclick="tabloyuSifirla()">⚠️ Tüm Tabloyu Sıfırla</button>
                </div>
            </div>
        </div>

        <!-- Soru Ekrani -->
        <div id="quiz-screen" class="screen hidden">
            <div class="quiz-header">
                <span id="question-number">Soru 1/5</span>
                <span id="score-display">Puan: 0</span>
            </div>
            
            <h2 id="question-text">Soru metni</h2>
            
            <div id="options-container" class="options-grid"></div>

            <div id="feedback" class="feedback-msg hidden"></div>
            <button id="next-btn" class="main-btn hidden" onclick="sonrakiSoru()">Sonraki Soru</button>
        </div>

        <!-- Oyun Sonu Ekrani -->
        <div id="end-screen" class="screen hidden">
            <h1>Oyun Bitti!</h1>
            <p id="final-score" style="margin-bottom: 10px;">Toplam Skorunuz: 0 / 50</p>
            <p id="final-message" style="margin-bottom: 15px;"></p>
            
            <div id="save-score-box" class="input-group">
                <input type="text" id="player-name" placeholder="Adınızı girin" maxlength="15">
                <button class="main-btn" onclick="skoruKaydet()">Skorumu Kaydet</button>
            </div>

            <button class="main-btn" style="background: rgba(255,255,255,0.1);" onclick="oyunuBaslat()">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        var tumSorular = [
            { metin: "manifestin ilk sarkisi nedir?", siklar: ["Zamansizdik", "Yasanacaksa", "Ariyo", "KTS"], dogrusik: 0 },
            { metin: "Manifest Grubuna 1. olarak Katilan Sarkici kimdir?", siklar: ["Esin", "Zoktay", "Sueda", "Lidya"], dogrusik: 2 },
            { metin: "Mina hangi rengi temsil etmektedir?", siklar: ["Lacivert", "Sari", "Kirmizi", "Turkuaz"], dogrusik: 2 },
            { metin: "Manifestin en cok dinlenen sarkisi hangisidir?", siklar: ["Hileli", "Toz pembe", "Yasanacaksa", "Snap"], dogrusik: 3 },
            { metin: "Instagramda en cok takipcisi bulunan uye Kimdir?", siklar: ["Esin", "Zoktay", "Lidya", "Hial"], dogrusik: 1 }
        ];

        var aktifSorular = [];
        var mevcutSoruIndex = 0;
        var puan = 0;
        var isAdmin = false;

        var API_URL = "https://kvdb.io/8xK43fA9U2W3dK7x1B8q9Z/manifest_quiz_scores";

        function karistir(dizi) {
            return dizi.sort(function() { return 0.5 - Math.random(); });
        }

        function oyunuBaslat() {
            puan = 0;
            mevcutSoruIndex = 0;
            aktifSorular = karistir(tumSorular.slice());

            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("end-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            document.getElementById("save-score-box").classList.remove("hidden");

            soruyuGoster();
        }

        function soruyuGoster() {
            var soru = aktifSorular[mevcutSoruIndex];
            document.getElementById("question-number").innerText = "Soru " + (mevcutSoruIndex + 1) + "/" + aktifSorular.length;
            document.getElementById("score-display").innerText = "Puan: " + puan;
            document.getElementById("question-text").innerText = soru.metin;

            var optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";
            document.getElementById("feedback").classList.add("hidden");
            document.getElementById("next-btn").classList.add("hidden");

            var harfler = ['A', 'B', 'C', 'D'];
            for (var i = 0; i < soru.siklar.length; i++) {
                (function(index) {
                    var btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = harfler[index] + ") " + soru.siklar[index];
                    btn.onclick = function() { cevabiKontrolEt(index, btn); };
                    optionsContainer.appendChild(btn);
                })(i);
            }
        }

        function cevabiKontrolEt(secilenIndex, secilenBtn) {
            var soru = aktifSorular[mevcutSoruIndex];
            var tumButonlar = document.querySelectorAll(".option-btn");
            for (var i = 0; i < tumButonlar.length; i++) tumButonlar[i].disabled = true;

            var feedback = document.getElementById("feedback");
            feedback.classList.remove("hidden");

            if (secilenIndex === soru.dogrusik) {
                secilenBtn.classList.add("correct");
                puan += 10;
                feedback.innerText = "TEBRİKLER! Doğru Cevap!";
                feedback.style.color = "#2ed573";
            } else {
                secilenBtn.classList.add("wrong");
                tumButonlar[soru.dogrusik].classList.add("correct");
                feedback.innerText = "Yanlış... Git Manifest dinle!";
                feedback.style.color = "#ff4757";
            }

            document.getElementById("score-display").innerText = "Puan: " + puan;
            document.getElementById("next-btn").classList.remove("hidden");
        }

        function sonrakiSoru() {
            mevcutSoruIndex++;
            if (mevcutSoruIndex < aktifSorular.length) soruyuGoster();
            else oyunuBitir();
        }

        function oyunuBitir() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("end-screen").classList.remove("hidden");
            
            var maxPuan = aktifSorular.length * 10;
            document.getElementById("final-score").innerText = "Toplam Skorunuz: " + puan + " / " + maxPuan;

            var mesaj = document.getElementById("final-message");
            if (puan === maxPuan) mesaj.innerText = "Koyu bir Manifest hayranısın! Bütün soruları bildin 🔥";
            else if (puan >= maxPuan / 2) mesaj.innerText = "Fena değil! Birkaç tekrarla tam puan alırsın 🎧";
            else mesaj.innerText = "Görünen o ki biraz daha Manifest dinlemelisin 😅";
        }

        // Skorları Sunucudan Çek ve Göster
        function skorlariGetir() {
            var listEl = document.getElementById("leaderboard-list");
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        listEl.innerHTML = "<li style='text-align:center; color:#aaa;'>Henüz kayıtlı skor yok!</li>";
                        return;
                    }
                    data.sort((a, b) => b.puan - a.puan);
                    listEl.innerHTML = "";
                    
                    data.forEach((item, index) => {
                        var li = document.createElement("li");
                        li.className = "leaderboard-item";
                        
                        var infoSpan = document.createElement("span");
                        infoSpan.innerHTML = "<strong>" + (index + 1) + ".</strong> " + item.isim + " - <span style='color:#00fff5;'>" + item.puan + " Puan</span>";
                        li.appendChild(infoSpan);

                        // Admin yetkisi varsa Düzenle ve Sil butonları ekle
                        if (isAdmin) {
                            var ctrlDiv = document.createElement("div");
                            ctrlDiv.className = "admin-controls";

                            var editBtn = document.createElement("button");
                            editBtn.className = "admin-action-btn";
                            editBtn.innerText = "✏️";
                            editBtn.onclick = function() { adminSkorDuzenle(index, item); };

                            var delBtn = document.createElement("button");
                            delBtn.className = "admin-action-btn";
                            delBtn.innerText = "❌";
                            delBtn.onclick = function() { adminSkorSil(index); };

                            ctrlDiv.appendChild(editBtn);
                            ctrlDiv.appendChild(delBtn);
                            li.appendChild(ctrlDiv);
                        }

                        listEl.appendChild(li);
                    });
                })
                .catch(() => {
                    listEl.innerHTML = "<li style='text-align:center; color:#aaa;'>Skorlar yüklenemedi.</li>";
                });
        }

        // Skoru Kaydetme
        function skoruKaydet() {
            var isimInput = document.getElementById("player-name");
            var isim = isimInput.value.trim();
            if (!isim) {
                alert("Lütfen adınızı girin!");
                return;
            }

            if (isim.toLowerCase() === "admin") {
                adminModuAc();
                alert("Admin modu aktifleşti!");
            }

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    var mevcutSkorlar = Array.isArray(data) ? data : [];
                    mevcutSkorlar.push({ isim: isim, puan: puan });

                    return veriyiKaydet(mevcutSkorlar);
                })
                .then(() => {
                    document.getElementById("save-score-box").classList.add("hidden");
                    alert("Skorunuz kaydedildi!");
                    skorlariGetir();
                });
        }

        // --- ADMIN İŞLEMLERİ ---

        function adminModuAc() {
            isAdmin = true;
            document.getElementById("admin-indicator").classList.remove("hidden");
            document.getElementById("admin-panel").classList.remove("hidden");
            skorlariGetir();
        }

        function veriyiKaydet(yeniVeri) {
            return fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(yeniVeri)
            });
        }

        function adminSkorSil(silinecekIndex) {
            if (!confirm("Bu oyuncuyu silmek istediğine emin misin?")) return;

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    data.sort((a, b) => b.puan - a.puan);
                    data.splice(silinecekIndex, 1);
                    return veriyiKaydet(data);
                })
                .then(() => skorlariGetir());
        }

        function adminSkorDuzenle(duzenlenecekIndex, eskiVeri) {
            var yeniIsim = prompt("Yeni İsim:", eskiVeri.isim);
            if (yeniIsim === null) return;
            var yeniPuan = prompt("Yeni Puan:", eskiVeri.puan);
            if (yeniPuan === null) return;

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    data.sort((a, b) => b.puan - a.puan);
                    data[duzenlenecekIndex] = { isim: yeniIsim, puan: parseInt(yeniPuan) || 0 };
                    return veriyiKaydet(data);
                })
                .then(() => skorlariGetir());
        }

        function adminOyuncuEkle() {
            var isim = document.getElementById("admin-add-name").value.trim();
            var p = parseInt(document.getElementById("admin-add-score").value);

            if (!isim || isNaN(p)) {
                alert("Geçerli bir isim ve puan girin!");
                return;
            }

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    var mevcutSkorlar = Array.isArray(data) ? data : [];
                    mevcutSkorlar.push({ isim: isim, puan: p });
                    return veriyiKaydet(mevcutSkorlar);
                })
                .then(() => {
                    document.getElementById("admin-add-name").value = "";
                    document.getElementById("admin-add-score").value = "";
                    skorlariGetir();
                });
        }

        function tabloyuSifirla() {
            if (confirm("Tüm tabloyu silmek istediğine emin misin?")) {
                veriyiKaydet([]).then(() => skorlariGetir());
            }
        }

        skorlariGetir();
    </script>
</body>
</html>
